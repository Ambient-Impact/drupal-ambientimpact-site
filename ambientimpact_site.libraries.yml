global-styling:
  css:
    theme:
      stylesheets/theme.css: {}
      stylesheets/components/scrollbar.css: {}
  dependencies:
    - ambientimpact_base/layout_properties
    - ambientimpact_ux/component.material.ripple
    - core/components.ambientimpact_site--reveal

global-scripts:
  js:
    javascript/global.js: { attributes: { defer: true } }
  dependencies:
    # Required for the :focus-within polyfill.
    - ambientimpact_core/ally.js
    - ambientimpact_core/framework
    - ambientimpact_ux/component.pointer_type

field_web_tags:
  css:
    theme:
      stylesheets/components/field_web_tags.css: {}

layout_z-index_properties:
  css:
    theme:
      stylesheets/layout/z-index_properties.css: {}

overlay:
  css:
    theme:
      stylesheets/components/overlay.css: {}

paragraph_compact:
  css:
    theme:
      stylesheets/components/paragraph_compact.css: {}

# Required because libraries-extend a component with our own component causes
# LibraryDiscoverParser to run out of memory on Drupal 10.5.x & 11.2.x.
refreshless-page-transition:
  css:
    theme:
      components/refreshless-page-transition/refreshless-page-transition.css: {}

# Required because libraries-extend a component with our own component causes
# LibraryDiscoverParser to run out of memory on Drupal 10.5.x & 11.2.x.
refreshless-progress-bar:
  css:
    theme:
      components/refreshless-progress-bar/refreshless-progress-bar.css: {}

view_front:
  css:
    theme:
      stylesheets/views/front.css: {}

view_tags_list:
  css:
    theme:
      stylesheets/views/tags_list.css: {}

web_snippets_links:
  css:
    theme:
      stylesheets/components/web_snippets_links.css: {}
