name: Ambient.Impact - Site theme
description: The theme used for ambientimpact.com.
type: theme
base theme: ambientimpact_base
package: Ambient.Impact
screenshot: images/screenshot.png
core_version_requirement: ^10.3 || ^11.0
php: 8.1

dependencies:
  - ambientimpact_core:ambientimpact_core
  - ambientimpact_icon:ambientimpact_icon
  - ambientimpact_ux:ambientimpact_ux

# These are identitical to those in ambientimpact_base, duplicated here because
# Drupal doesn't seem to allow inheriting regions.
#
# @see https://www.drupal.org/project/drupal/issues/301295
regions:
  header: 'Header'
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  breadcrumb: 'Breadcrumb'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  sidebar_first: 'First sidebar'
  sidebar_second: 'Second sidebar'
  footer: 'Footer'

libraries:
  - ambientimpact_site/global-styling
  - ambientimpact_site/global-scripts

libraries-extend:

  ambientimpact_base/tooltip:
    - ambientimpact_site/layout_z-index_properties

  ambientimpact_base/overlay:
    - ambientimpact_site/overlay

  ambientimpact_base/photoswipe:
    - ambientimpact_site/layout_z-index_properties

  ambientimpact_base/skip_link:
    - ambientimpact_site/layout_z-index_properties

  core/components.refreshless--page-transition:
    - ambientimpact_site/layout_z-index_properties
    - ambientimpact_site/refreshless-page-transition
    # Causes LibraryDiscoverParser to run out of memory on Drupal 10.5.x:
    # - core/components.ambientimpact_site--refreshless-page-transition

  core/components.refreshless--progress-bar:
    - ambientimpact_site/layout_z-index_properties
    - ambientimpact_site/refreshless-progress-bar
    # Causes LibraryDiscoverParser to run out of memory on Drupal 10.5.x:
    # - core/components.ambientimpact_site--progress-bar
